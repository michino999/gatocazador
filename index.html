<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gato Cazador</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #225a80; font-family: 'Press Start 2P', cursive; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; }
        
        .menu { text-align: center; background: #c6c6c6; padding: 40px; border: 4px solid #fff; box-shadow: 6px 6px 0px #000; color: black; }
        
        button { padding: 15px; font-size: 14px; cursor: pointer; background: #c6c6c6; border: 4px solid #fff; box-shadow: 4px 4px 0 #000; font-family: 'Press Start 2P', cursive; margin: 5px; width: 250px; }
        button:hover { background: #e0e0e0; }

        canvas { border: 4px solid #fff; background: black; display: none; }
        #marcador { display: none; font-size: 20px; margin-top: 10px; }
        #menu-ajustes { display: none; }
    </style>
</head>
<body>

    <div id="menu-inicio" class="menu">
        <h1>GATO CAZADOR</h1>
        <button onclick="empezarJuego()">Jugar</button>
        <button onclick="abrirAjustes()">Ajustes</button>
    </div>

    <div id="menu-ajustes" class="menu">
        <h2>AJUSTES</h2>
        <button onclick="cambiarVelocidad()" id="btn-velocidad">Velocidad: Normal</button>
        <button onclick="volverMenu()">Volver</button>
    </div>

    <canvas id="juego" width="600" height="400"></canvas>
    <div id="marcador">Puntos: <span id="puntos-valor">0</span></div>

    <script src="juego.js"></script>
</body>
</html>
